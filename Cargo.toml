[package]
name = "farman"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "FARMAN Terminal — a Windows terminal with first-class Persian and Arabic text support"
authors = ["Shahbaz Team"]
license = "MIT"
homepage = "https://shahbazteam.ir"
default-run = "farman"

[[bin]]
name = "farman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.7", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-bidi = { version = "0.3", features = ["hardcoded-data"] }
unicode-width = "0.2"
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
winit = "0.30.12"
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
